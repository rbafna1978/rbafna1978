<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>rishit@portfolio:~</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #00ff9f;
    --green-dim: #00cc7a;
    --green-faint: #00ff9f18;
    --amber: #ffb700;
    --blue: #4fc3f7;
    --red: #ff5f57;
    --gray: #4a4a5a;
    --gray-light: #8888a0;
    --bg: #0a0a0f;
    --bg2: #0f0f18;
    --surface: #12121e;
    --border: #1e1e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    height: 100%;
    overflow: hidden;
  }

  /* CRT scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* CRT flicker */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0,255,159,0.015);
    pointer-events: none;
    z-index: 999;
    animation: flicker 8s infinite;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.92; }
    97% { opacity: 1; }
    98% { opacity: 0.95; }
    99% { opacity: 1; }
  }

  /* Window chrome */
  #window {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  #titlebar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    user-select: none;
  }

  .dots { display: flex; gap: 7px; }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .dot:hover { filter: brightness(1.3); }
  .dot.red   { background: #ff5f57; }
  .dot.amber { background: #ffbd2e; }
  .dot.green { background: #28ca42; }

  .tab-title {
    color: var(--gray-light);
    font-size: 12px;
    margin: 0 auto;
    letter-spacing: 0.05em;
  }

  #terminal {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    scroll-behavior: smooth;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(0,255,159,0.04) 0%, transparent 70%),
      var(--bg);
  }

  #terminal::-webkit-scrollbar { width: 4px; }
  #terminal::-webkit-scrollbar-track { background: transparent; }
  #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-word; }
  .line.blank { height: 14px; }

  .prompt-line { display: flex; align-items: baseline; gap: 6px; }
  .user   { color: var(--green); font-weight: 500; }
  .at     { color: var(--gray); }
  .host   { color: var(--amber); font-weight: 500; }
  .sep    { color: var(--gray); }
  .path   { color: var(--blue); }
  .dollar { color: var(--gray-light); }

  .output { color: #c8d0e0; padding-left: 0; }
  .output.dim { color: var(--gray-light); }
  .output.green { color: var(--green); }
  .output.amber { color: var(--amber); }
  .output.blue  { color: var(--blue); }
  .output.red   { color: var(--red); }
  .output.bold  { font-weight: 700; }
  .output.accent { color: var(--green); font-weight: 500; }

  /* ASCII art */
  .ascii {
    color: var(--green-dim);
    font-size: 11px;
    line-height: 1.2;
  }

  /* Input row */
  #input-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 12px 24px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    caret-color: var(--green);
  }

  /* Typewriter cursor blink on output */
  .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--green);
    vertical-align: middle;
    animation: blink 1s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Tag pills */
  .tag {
    display: inline-block;
    border: 1px solid var(--green-dim);
    color: var(--green-dim);
    font-size: 11px;
    padding: 0 6px;
    border-radius: 2px;
    margin-right: 4px;
    margin-bottom: 2px;
  }

  .tag.amber { border-color: var(--amber); color: var(--amber); }
  .tag.blue  { border-color: var(--blue);  color: var(--blue); }

  /* Metric row */
  .metric { color: var(--amber); }

  /* Typing animation on boot lines */
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeSlide 0.15s ease forwards; }

  /* Help table */
  .cmd-name { color: var(--green); font-weight: 500; min-width: 120px; display: inline-block; }
  .cmd-desc { color: var(--gray-light); }
</style>
</head>
<body>

<div id="window">
  <div id="titlebar">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot amber"></div>
      <div class="dot green"></div>
    </div>
    <span class="tab-title">rishit@portfolio: ~</span>
  </div>

  <div id="terminal"></div>

  <div id="input-row">
    <span class="user">rishit</span><span class="at">@</span><span class="host">portfolio</span><span class="sep">:</span><span class="path">~</span><span class="dollar">$</span>
    <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type a command..."/>
  </div>
</div>

<script>
const term = document.getElementById('terminal');
const input = document.getElementById('cmd-input');
let history = [], histIdx = -1, booting = true;

// ── helpers ──────────────────────────────────────────────────────────────────

function el(tag, cls, html) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html !== undefined) d.innerHTML = html;
  return d;
}

function blank() { term.appendChild(el('div','line blank')); }

function line(html, cls = 'output') {
  const d = el('div', `line ${cls} animate-in`);
  d.innerHTML = html;
  term.appendChild(d);
  scroll();
}

function prompt(cmd) {
  const d = el('div', 'line prompt-line animate-in');
  d.innerHTML = `<span class="user">rishit</span><span class="at">@</span><span class="host">portfolio</span><span class="sep">:</span><span class="path">~</span><span class="dollar">$</span>&nbsp;<span class="output accent">${cmd}</span>`;
  term.appendChild(d);
}

function scroll() { term.scrollTop = term.scrollHeight; }

// Typewriter for a single string into a line div
function typeInto(div, text, speed, done) {
  let i = 0;
  div.innerHTML = '';
  term.appendChild(div);
  function tick() {
    if (i < text.length) {
      div.textContent += text[i++];
      scroll();
      setTimeout(tick, speed + Math.random() * speed * 0.4);
    } else {
      if (done) done();
    }
  }
  tick();
}

// Print an array of lines with staggered delay
function printLines(lines, delay, done) {
  let i = 0;
  function next() {
    if (i >= lines.length) { if (done) done(); return; }
    const [html, cls] = Array.isArray(lines[i]) ? lines[i] : [lines[i], 'output'];
    if (html === '') { blank(); i++; setTimeout(next, delay * 0.4); return; }
    line(html, cls);
    i++;
    setTimeout(next, delay);
  }
  next();
}

// ── content ──────────────────────────────────────────────────────────────────

const COMMANDS = {
  help: cmdHelp,
  about: cmdAbout,
  projects: cmdProjects,
  experience: cmdExperience,
  stack: cmdStack,
  papers: cmdPapers,
  contact: cmdContact,
  f1: cmdF1,
  clear: cmdClear,
  whoami: () => printLines([['rishit — software engineer, distributed systems nerd, F1 tragic.','output green']],0),
  ls: () => printLines([
    ['<span class="tag">about</span><span class="tag">projects</span><span class="tag">experience</span><span class="tag">stack</span><span class="tag">papers</span><span class="tag amber">contact</span><span class="tag blue">f1</span>','output'],
  ], 0),
};

function cmdHelp() {
  printLines([
    ['AVAILABLE COMMANDS', 'output amber bold'],

    ['<span class="cmd-name">about</span>      <span class="cmd-desc">who I am and what I care about</span>','output'],
    ['<span class="cmd-name">projects</span>   <span class="cmd-desc">things I built (the interesting parts)</span>','output'],
    ['<span class="cmd-name">experience</span> <span class="cmd-desc">where I\'ve shipped production code</span>','output'],
    ['<span class="cmd-name">stack</span>      <span class="cmd-desc">languages, tools, infra</span>','output'],
    ['<span class="cmd-name">papers</span>     <span class="cmd-desc">distributed systems papers I\'ve actually read</span>','output'],
    ['<span class="cmd-name">contact</span>    <span class="cmd-desc">get in touch</span>','output'],
    ['<span class="cmd-name">f1</span>         <span class="cmd-desc">important</span>','output'],
    ['<span class="cmd-name">whoami</span>     <span class="cmd-desc">one-liner</span>','output'],
    ['<span class="cmd-name">ls</span>         <span class="cmd-desc">list commands</span>','output'],
    ['<span class="cmd-name">clear</span>      <span class="cmd-desc">clear terminal</span>','output'],
    ['─────────────────────────────────────────────', 'output dim'],
  ], 18);
}

  printLines([

    ['Mumbai → Tempe, AZ', 'output dim'],

    ['I build systems that hold up under pressure.', 'output'],
    ['Not just locally. Not just in demos. Real constraints:', 'output'],
    ['sub-50ms p99 · 0.17% class imbalance · zero data loss on leader failover.', 'output amber'],
    [''],
    ['Philosophy:', 'output dim'],

    [''],

    ['  <span class="tag">Python</span><span class="tag">XGBoost</span><span class="tag">FastAPI</span><span class="tag">Redis</span><span class="tag">MLflow</span><span class="tag">Docker</span>','output'],
    ['  0.96 PR-AUC @ 0.17% class imbalance · p99 &lt;50ms · zero hot-path DB reads', 'output metric'],
    ['  PSI drift → auto-retrain → hot-swap model (no restart)', 'output dim'],

    [''],
    ['<span class="output" style="color:#a78bfa">●</span> <span class="output green bold">CyberSentient RAG</span> — threat intelligence retrieval', 'output'],
    ['  <span class="tag">Python</span><span class="tag">Qwen3-Embedding-8B</span><span class="tag">Qdrant</span><span class="tag">BM25</span>', 'output'],
    ['  100K+ CVE/CWE records · RRF + cross-encoder reranking · 400ms E2E', 'output metric'],
    ['  BM25 catches what embeddings miss. Reranking kills what BM25 gets wrong.', 'output dim'],
    ['  github.com/rbafna1978/cybersentient-rag', 'output blue'],
    [''],
    ['<span class="output" style="color:#4ade80">●</span> <span class="output green bold">Distributed KV Store</span> — Raft from scratch', 'output'],
    ['  <span class="tag">Java</span><span class="tag">Raft</span><span class="tag">gRPC</span><span class="tag">Protocol Buffers</span><span class="tag">Docker</span>', 'output'],
    ['  5-node cluster · sub-5ms reads · chaos-tested zero data loss', 'output metric'],
    ['  Built to understand consensus, not just cite it.', 'output dim'],
    ['  github.com/rbafna1978/distributed-kv-store', 'output blue'],
    [''],
    ['<span class="output blue">●</span> <span class="output green bold">AI Interview Coach</span> — voice-driven interview prep', 'output'],
    ['  <span class="tag blue">React</span><span class="tag blue">Web Speech API</span><span class="tag blue">Node.js</span>', 'output'],
    ['  STAR scoring · filler word detection · adaptive difficulty · live', 'output metric'],
    ['  interview-helper-three.vercel.app', 'output blue'],
    [''],
    ['<span class="output dim">●</span> <span class="output green bold">GitHub Dep Visualizer</span> — cross-repo dependency graph', 'output'],
    ['  <span class="tag">React</span><span class="tag">TypeScript</span><span class="tag">Cytoscape</span>', 'output'],
    ['  Finds the circular deps you didn\'t know were there.', 'output dim'],
    [''],
    ['<span class="output dim">●</span> <span class="output green bold">HTTP Server from Scratch</span> — C++, no frameworks', 'output'],
    ['  <span class="tag">C++</span><span class="tag">Sockets</span><span class="tag">Multithreading</span>', 'output'],
    ['  Raw sockets, custom thread pool. The point was to understand, not ship.', 'output dim'],
    ['─────────────────────────────────────────────', 'output dim'],

}

function cmdExperience() {
  printLines([
    ['EXPERIENCE', 'output amber bold'],
    ['─────────────────────────────────────────────', 'output dim'],
    [''],
    ['<span class="output green">▶</span> J. Miller Custom Cues · SWE Intern', 'output'],
    ['  Aug 2025 – Dec 2025 · Tempe, AZ', 'output dim'],
    ['  → 3D product configurator (Three.js + React)', 'output'],
    ['    cut customer design revision cycles by 35%', 'output metric'],
    ['  → PostgreSQL REST API + Stripe integration', 'output'],
    ['    100+ orders · sub-200ms response times', 'output metric'],
    [''],
    ['<span class="output green">▶</span> Winssoft Technologies · SWE Intern', 'output'],
    ['  May 2025 – Jul 2025 · Mumbai, IN', 'output dim'],
    ['  → SQL over 200K+ records — composite indexes + materialized views', 'output'],

}

function cmdStack() {

    ['STACK', 'output amber bold'],
    ['─────────────────────────────────────────────', 'output dim'],
    ['languages   <span class="output green">Python  Java  TypeScript  JavaScript  C++  SQL  Go</span>', 'output dim'],
    ['backend     <span class="output">FastAPI  Node.js  Express  gRPC  WebSockets</span>', 'output dim'],
    ['frontend    <span class="output">React  Next.js  Three.js  Tailwind CSS</span>', 'output dim'],
    ['data/ml     <span class="output">PostgreSQL  Redis  Qdrant  XGBoost  PyTorch  MLflow</span>', 'output dim'],
    ['infra       <span class="output">Docker  AWS (S3, EC2)  Linux  Git</span>', 'output dim'],
    ['─────────────────────────────────────────────', 'output dim'],

function cmdPapers() {
  printLines([
    ['PAPERS  <span class="output dim">(actually read, not just cited)</span>', 'output amber bold'],
    ['─────────────────────────────────────────────', 'output dim'],
    ['<span class="output green">✓</span> Raft: In Search of an Understandable Consensus Algorithm', 'output'],

function cmdF1() {

function cmdClear() {
  term.innerHTML = '';
}

// ── boot sequence ─────────────────────────────────────────────────────────────

const BOOT_ASCII = [
  ' ██████╗ ██╗███████╗██╗  ██╗██╗████████╗',
  ' ██╔══██╗██║██╔════╝██║  ██║██║╚══██╔══╝',
  ' ██████╔╝██║███████╗███████║██║   ██║   ',
  ' ██╔══██╗██║╚════██║██╔══██║██║   ██║   ',
  ' ██║  ██║██║███████║██║  ██║██║   ██║   ',
  ' ╚═╝  ╚═╝╚═╝╚══════╝╚═╝  ╚═╝╚═╝   ╚═╝  ',
];

function boot() {
  let step = 0;

  function nextStep() {
    switch(step++) {
      case 0:
        // ASCII art line by line
        let ai = 0;
        function asciiLine() {
          if (ai < BOOT_ASCII.length) {
            const d = el('div', 'line ascii animate-in');
            d.textContent = BOOT_ASCII[ai++];
            term.appendChild(d);
            scroll();
            setTimeout(asciiLine, 55);
          } else {
            setTimeout(nextStep, 200);
          }
        }
        asciiLine();
        break;

      case 1:
        blank();
        // Typewriter tagline
        const tl = el('div', 'line output animate-in');
        tl.style.color = '#4fc3f7';
        typeInto(tl, 'software engineer · distributed systems · arizona state ms cs', 18, () => setTimeout(nextStep, 250));
        break;

      case 2:
        blank();
        printLines([
          ['Booting portfolio...', 'output dim'],
        ], 0, () => setTimeout(nextStep, 350));
        break;

      case 3:
        printLines([
          ['<span class="output green">✓</span> systems loaded', 'output dim'],
          ['<span class="output green">✓</span> projects indexed', 'output dim'],
          ['<span class="output green">✓</span> F1 telemetry connected', 'output dim'],
        ], 160, () => setTimeout(nextStep, 300));
        break;

      case 4:
        blank();
        line(`Type <span class="output green">help</span> for available commands.`, 'output dim');
        blank();
        booting = false;
        input.focus();
        break;
    }
  }
  nextStep();
}

// ── input handling ────────────────────────────────────────────────────────────

function run(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  history.unshift(raw);
  histIdx = -1;
  blank();
  prompt(raw);
  blank();
  if (COMMANDS[cmd]) {
    COMMANDS[cmd]();
  } else {
    line(`<span class="output red">command not found:</span> ${cmd}  — try <span class="output green">help</span>`, 'output');
  }
  blank();
  setTimeout(scroll, 50);
}

input.addEventListener('keydown', e => {
  if (booting) { e.preventDefault(); return; }
  if (e.key === 'Enter') {
    run(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) input.value = history[++histIdx];
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) input.value = history[--histIdx];
    else { histIdx = -1; input.value = ''; }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    cmdClear();
  }
});

// Click anywhere on terminal → focus input
term.addEventListener('click', () => input.focus());
document.getElementById('window').addEventListener('click', () => input.focus());

// Tab completion
input.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value.toLowerCase().trim();
    const match = Object.keys(COMMANDS).find(c => c.startsWith(val) && c !== val);
    if (match) input.value = match;
  }
});

// ── go ─────────────────────────────────────────────────────────────────────────
boot();
</script>
