  <text x="380" y="231" class="mono" font-size="11" fill="#9BA0B5">QDRANT &#183; BM25 &#183; FASTAPI</text>
  <circle cx="608" cy="227" r="9" fill="#FFD43B"/>
  <text x="608" y="231" class="mono" font-size="10" font-weight="700" fill="#15151E" text-anchor="middle">M</text>
  <text x="650" y="232" class="mono" font-size="14" font-weight="700" fill="#C9CBDA">400MS E2E</text>

  <!-- row 4 — Distributed KV Store (HARD) -->
  <text x="32" y="274" class="mono" font-size="15" font-weight="700" fill="#F5F5F5">P4</text>
  <text x="80" y="274" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">DISTRIBUTED KV STORE</text>
  <text x="380" y="273" class="mono" font-size="11" fill="#9BA0B5">JAVA &#183; GRPC &#183; RAFT</text>
  <circle cx="608" cy="269" r="9" fill="#F5F5F5" stroke="#5C5F72" stroke-width="1"/>
  <text x="608" y="273" class="mono" font-size="10" font-weight="700" fill="#15151E" text-anchor="middle">H</text>
