<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rishit Bafna timing tower">
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      .live { animation: pulse 1.6s ease-in-out infinite; }
    </style>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E10600"/>
      <stop offset="100%" stop-color="#7A0300"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="840" height="400" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="840" height="400" fill="#15151E"/>
    <path d="M600 30 C 690 5, 790 55, 815 115 S 765 205, 695 180 S 650 115, 605 140 S 565 210, 620 235"
          fill="none" stroke="#22222E" stroke-width="4" opacity="0.6"/>
    <rect x="0" y="0" width="840" height="6" fill="url(#topbar)"/>
  </g>

  <!-- header -->
  <text x="32" y="52" class="sans" font-size="27" font-weight="700" fill="#FFFFFF">RISHIT BAFNA</text>
  <text x="32" y="74" class="mono" font-size="12" letter-spacing="1.5" fill="#8B8FA3">MS CS &#183; ARIZONA STATE &#183; TEMPE, AZ</text>

  <circle class="live" cx="682" cy="46" r="5" fill="#E10600"/>
  <text x="695" y="50" class="mono" font-size="12" letter-spacing="0.5" fill="#E10600">SESSION: CAREER &#8212; LIVE</text>

  <line x1="32" y1="92" x2="808" y2="92" stroke="#2A2A38" stroke-width="1"/>

  <!-- column headers -->
