  <text x="80" y="112" class="mono" font-size="11" letter-spacing="1" fill="#5C5F72">PROJECT</text>
  <text x="380" y="112" class="mono" font-size="11" letter-spacing="1" fill="#5C5F72">STACK</text>
  <text x="592" y="112" class="mono" font-size="11" letter-spacing="1" fill="#5C5F72">TYRE</text>
  <text x="650" y="112" class="mono" font-size="11" letter-spacing="1" fill="#5C5F72">READOUT</text>

  <!-- row backgrounds (alternating) -->
  <rect x="20" y="124" width="800" height="34" rx="4" fill="#1B1B27" opacity="0.55"/>
  <rect x="20" y="208" width="800" height="34" rx="4" fill="#1B1B27" opacity="0.55"/>
  <rect x="20" y="292" width="800" height="34" rx="4" fill="#1B1B27" opacity="0.55"/>

  <!-- row 1 — F1 Strategy RL (SOFT / fastest-lap purple) -->
  <text x="32" y="148" class="mono" font-size="15" font-weight="700" fill="#F5F5F5">P1</text>
  <text x="80" y="148" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">F1 STRATEGY RL</text>
  <text x="380" y="147" class="mono" font-size="11" fill="#9BA0B5">PYTORCH &#183; FASTAPI &#183; REACT</text>
  <circle cx="608" cy="143" r="9" fill="#FF2D2D"/>
  <text x="608" y="147" class="mono" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
