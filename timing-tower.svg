  <text x="32" y="316" class="mono" font-size="15" font-weight="700" fill="#F5F5F5">P5</text>
  <text x="80" y="316" class="sans" font-size="15" font-weight="700" fill="#FFFFFF">AI INTERVIEW COACH</text>
  <text x="380" y="315" class="mono" font-size="11" fill="#9BA0B5">REACT &#183; WEB SPEECH API</text>
  <circle cx="608" cy="311" r="9" fill="#F5F5F5" stroke="#5C5F72" stroke-width="1"/>
  <text x="608" y="315" class="mono" font-size="10" font-weight="700" fill="#15151E" text-anchor="middle">H</text>
  <text x="650" y="316" class="mono" font-size="14" font-weight="700" fill="#C9CBDA">50+ USERS</text>

  <line x1="32" y1="344" x2="808" y2="344" stroke="#2A2A38" stroke-width="1"/>
  <text x="32" y="368" class="mono" font-size="12" letter-spacing="0.5" fill="#8B8FA3">NEXT ON GRID: NEW GRAD SWE &#183; BACKEND &#183; ML INFRA &#183; 2027</text>
  <text x="808" y="368" class="mono" font-size="11" fill="#5C5F72" text-anchor="end">TEMPE, AZ</text>
